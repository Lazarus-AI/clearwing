rules:
  # ── CWE-22: Path traversal in archive extraction (Zip Slip) ──────────────────
  #
  # Pattern from CVE-2026-28208 (junrar): archive entry name used in path
  # construction without normalizing backslashes on non-Windows hosts.

  - id: java-archive-path-traversal
    message: >
      Archive entry name used in file path construction without normalizing
      path separators or checking for traversal sequences. On non-Windows
      systems, backslash-based traversal (..\\) bypasses forward-slash-only
      containment checks (CWE-22 / Zip Slip).
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-22"
      confidence: MEDIUM
    pattern-either:
      - pattern: new File($DEST, $ENTRY.getName())
      - pattern: new File($DEST, $ENTRY.getFileName())
      - pattern: Paths.get($DEST, $ENTRY.getName())
      - pattern: $DEST.resolve($ENTRY.getName())
      - pattern: new File($DEST + File.separator + $ENTRY.getName())

  - id: java-canonical-path-startswith
    message: >
      getCanonicalPath().startsWith() containment check without separator-
      normalizing the entry name first. A backslash-containing name on
      Unix passes the startsWith check despite traversing upward (CWE-22).
    severity: WARNING
    languages: [java]
    metadata:
      cwe: "CWE-22"
      confidence: MEDIUM
    patterns:
      - pattern: $FILE.getCanonicalPath().startsWith($BASE)
      - pattern-not-inside: |
          $NAME = $NAME.replace('\\', '/');
          ...
          $FILE.getCanonicalPath().startsWith($BASE)

  # ── CWE-347: Signature verification that accepts empty sequences ─────────────
  #
  # Pattern from CVE-2026-5588 (Bouncy Castle): loop over signature components
  # initializes `failed = false`, never sets it on empty input, returns !failed.

  - id: java-verify-loop-empty-bypass
    message: >
      Verification loop initializes a boolean to false and returns its
      negation after iterating. If the collection is empty, the loop never
      executes and verification succeeds without performing any cryptographic
      check (CWE-347).
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-347"
      confidence: MEDIUM
    patterns:
      - pattern: |
          boolean $FAILED = false;
          ...
          for (...) {
            ...
          }
          ...
          return !$FAILED;

  - id: java-verify-no-empty-check
    message: >
      Signature verification iterates over a sequence without first checking
      that the sequence is non-empty. An empty signature sequence (e.g. ASN.1
      SEQUENCE with zero elements) would pass verification trivially (CWE-347).
    severity: WARNING
    languages: [java]
    metadata:
      cwe: "CWE-347"
      confidence: LOW
    patterns:
      - pattern: |
          for (int $I = 0; $I < $SEQ.size(); $I++) {
            ...
          }
      - pattern-not-inside: |
          if ($SEQ.size() == 0) { ... }
          ...
          for (int $I = 0; $I < $SEQ.size(); $I++) { ... }
      - pattern-not-inside: |
          if ($SEQ.size() < 1) { ... }
          ...
          for (int $I = 0; $I < $SEQ.size(); $I++) { ... }

  # ── CWE-502: Deserialization of untrusted data ───────────────────────────────

  - id: java-unsafe-deserialization
    message: >
      ObjectInputStream.readObject() called on data from an untrusted source
      without an ObjectInputFilter. Allows arbitrary code execution via
      crafted serialized objects (CWE-502).
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-502"
      confidence: MEDIUM
    pattern-either:
      - pattern: new ObjectInputStream($STREAM).readObject()
      - pattern: |
          ObjectInputStream $OIS = new ObjectInputStream($STREAM);
          ...
          $OIS.readObject();

  # ── CWE-295: Missing certificate/key validation ─────────────────────────────

  - id: java-dsa-no-param-validation
    message: >
      DSA or EC public key parameters set without validating domain parameter
      bounds (g > 1, y > 1, g^q mod p == 1). Degenerate parameters enable
      universal signature forgery (CWE-347).
    severity: WARNING
    languages: [java]
    metadata:
      cwe: "CWE-347"
      confidence: LOW
    pattern-either:
      - pattern: |
          $KEY.setPublic($P, $Q, $G, $Y)
      - pattern: |
          $KEY.setPublicHex($P, $Q, $G, $Y)

  # ── CWE-22: Path traversal from HTTP request (semgrep/semgrep-rules) ────────

  - id: java-httpservlet-path-traversal
    message: >
      User-controlled HTTP request data flows into a file path. A malicious
      actor can use '../' sequences to read or write arbitrary files (CWE-22).
      Sanitize with FilenameUtils.getName() or validate the canonical path.
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-22"
      confidence: MEDIUM
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: (HttpServletRequest $REQ)
    pattern-sanitizers:
      - pattern: org.apache.commons.io.FilenameUtils.getName(...)
    pattern-sinks:
      - pattern-either:
          - pattern: new java.io.File(...)
          - pattern: new java.io.FileOutputStream(...)
          - pattern: new java.io.FileInputStream(...)
          - pattern: Paths.get(...)
          - pattern: Files.newInputStream(...)
          - pattern: Files.newOutputStream(...)

  # ── CWE-78: Command injection (from semgrep/semgrep-rules) ──────────────────

  - id: java-command-injection
    message: >
      User input from HTTP request flows into a command execution sink.
      This enables arbitrary command execution (CWE-78). Use allowlists
      or parameterized APIs.
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-78"
      confidence: MEDIUM
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: (HttpServletRequest $REQ)
    pattern-sinks:
      - pattern-either:
          - pattern: Runtime.getRuntime().exec(...)
          - pattern: new ProcessBuilder(...)

  # ── CWE-89: SQL injection (from semgrep/semgrep-rules) ──────────────────────

  - id: java-sql-injection
    message: >
      User input concatenated into SQL query string. Use prepared statements
      with parameterized queries to prevent SQL injection (CWE-89).
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-89"
      confidence: MEDIUM
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: (HttpServletRequest $REQ)
    pattern-sanitizers:
      - pattern: $STMT.setString(...)
    pattern-sinks:
      - pattern-either:
          - pattern: $STMT.executeQuery($QUERY)
          - pattern: $STMT.execute($QUERY)
          - pattern: $CONN.createStatement().executeQuery($QUERY)

  # ── CWE-327: Weak crypto algorithms ─────────────────────────────────────────

  - id: java-weak-crypto
    message: >
      Use of cryptographically broken algorithm (DES, DESede, MD5, SHA-1, RC4,
      Blowfish, ECB mode). These are insufficient for security (CWE-327).
    severity: WARNING
    languages: [java]
    metadata:
      cwe: "CWE-327"
      confidence: HIGH
    pattern-either:
      - pattern: Cipher.getInstance("DES")
      - pattern: Cipher.getInstance("DES/...")
      - pattern: Cipher.getInstance("DESede")
      - pattern: Cipher.getInstance("DESede/...")
      - pattern: Cipher.getInstance("RC4")
      - pattern: Cipher.getInstance("Blowfish")
      - pattern: Cipher.getInstance("AES/ECB/...")
      - pattern: Cipher.getInstance("AES")
      - pattern: MessageDigest.getInstance("MD5")
      - pattern: MessageDigest.getInstance("SHA-1")
      - pattern: MessageDigest.getInstance("SHA1")

  # ── CWE-295: Insecure TLS trust manager ────────────────────────────────────

  - id: java-insecure-trust-manager
    message: >
      Custom TrustManager that does not validate certificates. This disables
      TLS certificate verification entirely, enabling MitM attacks (CWE-295).
    severity: ERROR
    languages: [java]
    metadata:
      cwe: "CWE-295"
      confidence: HIGH
    pattern-either:
      - pattern: |
          new X509TrustManager() {
            ...
            public void checkServerTrusted(...) { }
            ...
          }
      - pattern: |
          new X509TrustManager() {
            ...
            public void checkClientTrusted(...) { }
            ...
          }

