rules:
  # ── CWE-863: Authorization check based on config key presence vs value origin ─
  #
  # Pattern from CVE-2026-40034 (gitoxide): security guard checks whether a
  # config section EXISTS rather than whether the dangerous value ORIGINATED
  # from that section. Attacker can arrange for the section to exist (e.g.
  # via submodule init) while the dangerous value comes from untrusted source.

  - id: rust-authz-section-presence-vs-origin
    message: >
      Security decision based on whether a configuration section or key exists,
      rather than on where the resolved value originated. An attacker may cause
      the section to exist while supplying a dangerous value from an untrusted
      source (CWE-863).
    severity: WARNING
    languages: [rust]
    metadata:
      cwe: "CWE-863"
      confidence: LOW
    pattern-either:
      - pattern: |
          if $CONFIG.has_section($SECTION) { ... }
      - pattern: |
          if $CONFIG.contains_key($KEY) { ... }

  # ── CWE-787: Post-initialization write to device/queue registers ─────────────
  #
  # Pattern from CVE-2026-5747 (Firecracker): virtio queue configuration
  # registers writable after device activation, bypassing bounds validation
  # that only ran during init.

  - id: rust-device-register-write-no-state-check
    message: >
      Device register write handler does not check device state/status before
      modifying configuration. If bounds validation only occurs at activation
      time, a post-activation write bypasses those checks (CWE-787/CWE-20).
    severity: WARNING
    languages: [rust]
    metadata:
      cwe: "CWE-787"
      confidence: LOW
    patterns:
      - pattern-inside: |
          fn $WRITE_FN(...) {
            ...
          }
      - pattern: $QUEUE.$FIELD = $VALUE
      - pattern-not-inside: |
          if $STATUS ... {
            ...
            $QUEUE.$FIELD = $VALUE
            ...
          }
      - metavariable-regex:
          metavariable: $WRITE_FN
          regex: "(?i)(write|set|handle_write|store)"

  # ── CWE-190: Unsafe integer arithmetic ──────────────────────────────────────

  - id: rust-unchecked-arithmetic-unsafe
    message: >
      Arithmetic operation inside an unsafe block without checked_* or
      saturating_* variant. Overflow in unsafe context can cause UB or
      buffer overruns (CWE-190).
    severity: WARNING
    languages: [rust]
    metadata:
      cwe: "CWE-190"
      confidence: LOW
    patterns:
      - pattern-inside: |
          unsafe {
            ...
          }
      - pattern-either:
          - pattern: $A + $B
          - pattern: $A * $B
      - pattern-not: $A.checked_add($B)
      - pattern-not: $A.checked_mul($B)
      - pattern-not: $A.saturating_add($B)
      - pattern-not: $A.saturating_mul($B)

  # ── CWE-416: Use after free / double free on error paths ────────────────────

  - id: rust-drop-then-use-raw-ptr
    message: >
      Raw pointer potentially used after the owning value is dropped or moved.
      In unsafe Rust, this constitutes a use-after-free (CWE-416).
    severity: WARNING
    languages: [rust]
    metadata:
      cwe: "CWE-416"
      confidence: LOW
    patterns:
      - pattern: |
          drop($OWNER);
          ...
          *$PTR

  # ── CWE-22: Path traversal in extraction/archive handling ───────────────────

  - id: rust-path-join-untrusted
    message: >
      Path::join or push called with a potentially untrusted component without
      checking for traversal sequences (..) or absolute paths. May allow
      writing/reading outside the intended directory (CWE-22).
    severity: WARNING
    languages: [rust]
    metadata:
      cwe: "CWE-22"
      confidence: LOW
    pattern-either:
      - pattern: $BASE.join($ENTRY)
      - pattern: $BASE.push($ENTRY)

  # ── CWE-242: Unsafe block usage (from semgrep/semgrep-rules) ──────────────────

  - id: rust-unsafe-usage
    message: >
      Detected 'unsafe' block. Audit for memory safety violations including
      use-after-free, double-free, buffer overflows, and data races (CWE-242).
    severity: INFO
    languages: [rust]
    metadata:
      cwe: "CWE-242"
      confidence: HIGH
    pattern: "unsafe { ... }"

  # ── CWE-328: Insecure hash algorithms ───────────────────────────────────────

  - id: rust-insecure-hashes
    message: >
      Use of cryptographically broken hash function (MD2, MD4, MD5, SHA-1).
      Use SHA-256 or stronger for any security-relevant purpose (CWE-328).
    severity: WARNING
    languages: [rust]
    metadata:
      cwe: "CWE-328"
      confidence: HIGH
    pattern-either:
      - pattern: md2::Md2::new(...)
      - pattern: md4::Md4::new(...)
      - pattern: md5::Md5::new(...)
      - pattern: sha1::Sha1::new(...)
      - pattern: Md5::new()
      - pattern: Sha1::new()

  # ── CWE-295: SSL verification disabled ──────────────────────────────────────

  - id: rust-ssl-verify-none
    message: >
      SSL certificate verification disabled via SSL_VERIFY_NONE. This allows
      MitM attacks on all TLS connections (CWE-295).
    severity: ERROR
    languages: [rust]
    metadata:
      cwe: "CWE-295"
      confidence: HIGH
    pattern-either:
      - pattern: $BUILDER.set_verify(openssl::ssl::SSL_VERIFY_NONE)
      - pattern: $BUILDER.danger_accept_invalid_certs(true)
      - pattern: $BUILDER.danger_accept_invalid_hostnames(true)

  # ── CWE-676: Use of inherently dangerous functions ──────────────────────────

  - id: rust-dangerous-ffi
    message: >
      Direct call to libc/OS function via FFI without bounds checking. Ensure
      all buffer sizes and pointer lifetimes are validated (CWE-676).
    severity: WARNING
    languages: [rust]
    metadata:
      cwe: "CWE-676"
      confidence: LOW
    patterns:
      - pattern-inside: |
          unsafe { ... }
      - pattern-either:
          - pattern: libc::memcpy(...)
          - pattern: libc::memmove(...)
          - pattern: libc::strcpy(...)
          - pattern: std::ptr::copy_nonoverlapping(...)
          - pattern: std::ptr::write(...)

  # ── CWE-362: Data race via shared mutable state ─────────────────────────────

  - id: rust-static-mut
    message: >
      Mutable static variable detected. Access to static mut is inherently
      unsafe and can cause data races in multithreaded code (CWE-362).
      Use AtomicXxx, Mutex, or once_cell instead.
    severity: WARNING
    languages: [rust]
    metadata:
      cwe: "CWE-362"
      confidence: HIGH
    pattern: static mut $VAR: $TYPE = ...;

  paths:
    exclude:
      - "**/test/**"
      - "**/tests/**"
      - "**/benches/**"
