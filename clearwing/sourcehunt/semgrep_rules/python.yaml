rules:
  # ── CWE-94/95: eval/exec with dynamic input ─────────────────────────────────
  #
  # Pattern from CVE-2026-47391 (PraisonAI): eval(expression) used as a tool
  # callable by an LLM agent, reachable from unauthenticated A2A endpoint.

  - id: python-eval-dynamic
    message: >
      eval() or exec() called with a non-literal argument. If attacker-
      controlled data reaches this sink (directly or via LLM tool invocation),
      arbitrary Python code executes (CWE-94).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-94"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: eval($EXPR)
          - pattern: exec($EXPR)
      - pattern-not: eval("...")
      - pattern-not: exec("...")

  - id: python-eval-in-tool-function
    message: >
      eval() or exec() used inside a function that appears to be an agent tool
      or API handler. LLM-driven eval enables arbitrary code execution from
      any upstream caller that controls the argument (CWE-94).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-94"
      confidence: MEDIUM
    patterns:
      - pattern-inside: |
          def $FUNC(..., $EXPR, ...):
            ...
      - pattern-either:
          - pattern: eval($EXPR)
          - pattern: exec($EXPR)

  # ── CWE-306: Missing authentication on network-exposed endpoints ─────────────

  - id: python-bind-all-interfaces-no-auth
    message: >
      Server binding to 0.0.0.0 without visible authentication middleware.
      Any network-reachable client can access the endpoint (CWE-306).
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-306"
      confidence: LOW
    pattern-either:
      - pattern: uvicorn.run($APP, host="0.0.0.0", ...)
      - pattern: app.run(host="0.0.0.0", ...)
      - pattern: serve(host="0.0.0.0", ...)

  # ── CWE-78: Command injection via subprocess ─────────────────────────────────

  - id: python-subprocess-shell-true
    message: >
      subprocess called with shell=True and a non-literal command. If the
      command includes user input, this enables shell injection (CWE-78).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-78"
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: subprocess.call($CMD, shell=True, ...)
          - pattern: subprocess.run($CMD, shell=True, ...)
          - pattern: subprocess.Popen($CMD, shell=True, ...)
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD)
      - pattern-not: subprocess.call("...", shell=True, ...)
      - pattern-not: subprocess.run("...", shell=True, ...)
      - pattern-not: os.system("...")

  # ── CWE-22: Path traversal ──────────────────────────────────────────────────

  - id: python-path-traversal
    message: >
      User-supplied path joined without sanitization. If the input contains
      '../' sequences, files outside the intended directory can be accessed
      (CWE-22).
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-22"
      confidence: LOW
    pattern-either:
      - pattern: open(os.path.join($BASE, $USER_INPUT), ...)
      - pattern: Path($BASE) / $USER_INPUT

  # ── CWE-502: Pickle/YAML deserialization ─────────────────────────────────────

  - id: python-unsafe-deserialize
    message: >
      Unsafe deserialization function called. pickle.loads, yaml.load (without
      SafeLoader), and marshal.loads can execute arbitrary code on crafted
      input (CWE-502).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-502"
      confidence: HIGH
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: yaml.load($DATA)
      - pattern: yaml.load($DATA, Loader=yaml.FullLoader)
      - pattern: yaml.load($DATA, Loader=yaml.UnsafeLoader)
      - pattern: marshal.loads(...)

  # ── CWE-330: Weak randomness for security purposes ──────────────────────────

  - id: python-weak-random-security
    message: >
      random module used in a security-sensitive context (token, secret, key,
      password). The random module is not cryptographically secure — use
      secrets module instead (CWE-330).
    severity: WARNING
    languages: [python]
    metadata:
      cwe: "CWE-330"
      confidence: LOW
    pattern-either:
      - pattern: random.choice(...)
      - pattern: random.randint(...)
      - pattern: random.random()
      - pattern: random.randbytes(...)

  # ── CWE-502: Additional deserialization variants (semgrep/semgrep-rules) ────

  - id: python-pickle-variants
    message: >
      Deserialization via pickle/cPickle/dill/shelve detected. These can
      execute arbitrary code when loading untrusted data. Use JSON or
      other safe serialization formats (CWE-502).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-502"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: pickle.$FUNC(...)
          - pattern: _pickle.$FUNC(...)
          - pattern: cPickle.$FUNC(...)
          - pattern: dill.$FUNC(...)
          - pattern: shelve.$FUNC(...)
      - pattern-not: pickle.$FUNC("...")
      - pattern-not: _pickle.$FUNC("...")

  # ── CWE-94: Dangerous code execution patterns ───────────────────────────────

  - id: python-dangerous-code-objects
    message: >
      compile() + exec()/eval() or code.InteractiveConsole detected. If
      input is attacker-controlled, this enables arbitrary code execution
      (CWE-94).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-94"
      confidence: MEDIUM
    pattern-either:
      - pattern: exec(compile($CODE, ...))
      - pattern: eval(compile($CODE, ...))
      - pattern: code.InteractiveConsole(...)

  # ── CWE-611: XML external entity injection ──────────────────────────────────

  - id: python-xxe
    message: >
      XML parsing without disabling external entity resolution. Use
      defusedxml or set resolve_entities=False to prevent XXE (CWE-611).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-611"
      confidence: MEDIUM
    pattern-either:
      - pattern: lxml.etree.parse(...)
      - pattern: lxml.etree.fromstring(...)
      - pattern: xml.etree.ElementTree.parse(...)
      - pattern: xml.sax.parse(...)
      - pattern: xml.dom.minidom.parse(...)
      - pattern: xml.dom.minidom.parseString(...)

  # ── CWE-89: SQL injection via string formatting ─────────────────────────────

  - id: python-sql-format-string
    message: >
      SQL query constructed via f-string or .format(). Use parameterized
      queries with %s placeholders or ? parameters (CWE-89).
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-89"
      confidence: MEDIUM
    pattern-either:
      - pattern: $CURSOR.execute(f"...", ...)
      - pattern: $CURSOR.execute("...".format(...), ...)
      - pattern: $CURSOR.execute("..." + $VAR, ...)
      - pattern: $CURSOR.execute("..." % $VAR, ...)

  # ── CWE-295: Disabled SSL verification ──────────────────────────────────────

  - id: python-ssl-verify-disabled
    message: >
      SSL/TLS certificate verification disabled. This enables MitM attacks
      (CWE-295). Remove verify=False or use a proper CA bundle.
    severity: ERROR
    languages: [python]
    metadata:
      cwe: "CWE-295"
      confidence: HIGH
    pattern-either:
      - pattern: requests.get(..., verify=False, ...)
      - pattern: requests.post(..., verify=False, ...)
      - pattern: requests.put(..., verify=False, ...)
      - pattern: requests.delete(..., verify=False, ...)
      - pattern: requests.patch(..., verify=False, ...)
      - pattern: httpx.get(..., verify=False, ...)
      - pattern: httpx.post(..., verify=False, ...)
      - pattern: urllib3.disable_warnings(...)

  paths:
    exclude:
      - "**/test/**"
      - "**/tests/**"
      - "**/*_test.py"
      - "**/test_*.py"
