rules:
  # ── CWE-347: DSA/ECDSA domain parameter validation missing ───────────────────
  #
  # Pattern from CVE-2026-4600 (jsrsasign): setPublic accepts arbitrary domain
  # parameters without FIPS 186-4 bounds checks — g=1, y=1 enables universal
  # signature forgery.

  - id: js-crypto-set-public-no-validation
    message: >
      Cryptographic public key set without validating domain parameters.
      Accepting degenerate values (g=1, y=1, p < q) enables universal
      signature forgery (CWE-347). Ensure FIPS 186-4 §4.7 bounds are checked.
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-347"
      confidence: LOW
    pattern-either:
      - pattern: |
          $THIS.$P = $P_VAL;
          $THIS.$Q = $Q_VAL;
          $THIS.$G = $G_VAL;
          $THIS.$Y = $Y_VAL;
      - pattern: |
          this.p = $P;
          this.q = $Q;
          this.g = $G;
          this.y = $Y;

  - id: js-bigint-no-range-check
    message: >
      BigInteger value assigned from external input without a range/bounds
      check. In cryptographic contexts, unchecked values may be degenerate
      (0, 1) or negative, breaking security assumptions (CWE-347).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-347"
      confidence: LOW
    patterns:
      - pattern: new BigInteger($INPUT)
      - pattern-not-inside: |
          if ($VAL.compareTo(...) ...) { ... }
          ...
          new BigInteger($INPUT)

  # ── CWE-94/95: eval() with dynamic input ────────────────────────────────────

  - id: js-eval-dynamic
    message: >
      eval() called with a non-literal argument. If the argument contains
      user-supplied data, this enables arbitrary code execution (CWE-94).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-94"
      confidence: MEDIUM
    patterns:
      - pattern: eval($EXPR)
      - pattern-not: eval("...")

  - id: js-function-constructor
    message: >
      Function constructor called with dynamic arguments — equivalent to eval
      and enables code injection (CWE-94).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-94"
      confidence: MEDIUM
    patterns:
      - pattern: new Function($BODY)
      - pattern-not: new Function("...")

  # ── CWE-79: innerHTML/outerHTML with unsanitized input ───────────────────────

  - id: js-innerhtml-assignment
    message: >
      innerHTML or outerHTML assigned from a variable. If the value contains
      user input, this enables XSS (CWE-79). Use textContent or a sanitizer.
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-79"
      confidence: LOW
    pattern-either:
      - pattern: $EL.innerHTML = $VAR
      - pattern: $EL.outerHTML = $VAR

  # ── CWE-327: Weak crypto usage ──────────────────────────────────────────────

  - id: js-weak-hash
    message: >
      MD5 or SHA-1 used in a context that may require collision resistance.
      These algorithms are broken for signature verification and certificate
      validation (CWE-327).
    severity: WARNING
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-327"
      confidence: LOW
    pattern-either:
      - pattern: crypto.createHash("md5")
      - pattern: crypto.createHash("sha1")
      - pattern: CryptoJS.MD5(...)
      - pattern: CryptoJS.SHA1(...)

  # ── CWE-347: Signature verify returning true without checking ────────────────

  - id: js-verify-always-true
    message: >
      Signature verification function returns true without calling a
      cryptographic verify operation on all code paths. An empty or
      malformed signature may bypass verification (CWE-347).
    severity: ERROR
    languages: [javascript, typescript]
    metadata:
      cwe: "CWE-347"
      confidence: LOW
    patterns:
      - pattern: |
          function $VERIFY(...) {
            ...
            return true;
          }
      - metavariable-regex:
          metavariable: $VERIFY
          regex: "(?i)(verify|validate|check).*"

